<header class="app-topbar">
  <div class="app-topbar__identidad">
    <span class="app-topbar__negocio">{{ nombreNegocio() }}</span>
    @if (breadcrumb().length > 0) {
      <nav class="app-topbar__breadcrumb" aria-label="Ruta actual">
        @for (item of breadcrumb(); track item.label; let ultimo = $last) {
          @if (item.link && !ultimo) {
            <a [routerLink]="item.link">{{ item.label }}</a>
          } @else {
            <span [class.app-topbar__breadcrumb-actual]="ultimo">{{ item.label }}</span>
          }
          @if (!ultimo) { <span class="app-topbar__breadcrumb-sep">/</span> }
        }
      </nav>
    }
  </div>

  <div class="app-topbar__usuario">
    <button type="button" class="app-topbar__toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto()">
      <span class="app-topbar__avatar">{{ usuario()?.iniciales }}</span>
      <span class="app-topbar__nombre">{{ usuario()?.nombre }}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </button>

    @if (menuAbierto()) {
      <div class="app-topbar__menu" role="menu">
        <div class="app-topbar__menu-info">
          <div class="app-topbar__menu-nombre">{{ usuario()?.nombre }}</div>
          <div class="app-topbar__menu-correo">{{ usuario()?.email }}</div>
        </div>
        <button type="button" class="app-topbar__cerrar-sesion" (click)="cerrarSesion()" role="menuitem">Cerrar sesión</button>
      </div>
    }
  </div>
</header>
