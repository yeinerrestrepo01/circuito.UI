<div class="kpi-tile ring-tile" [style.--accent]="accent()" [style.--ring-pct.%]="pct()">
  <div class="ring">
    <span class="ring__value">{{ pct() }}%</span>
  </div>
  <div>
    <div class="kpi-tile__label">{{ label() }}</div>
    @if (sublabel()) {
      <div class="muted" style="font-size:12px; margin-top:2px;">{{ sublabel() }}</div>
    }
  </div>
</div>
