<button
  type="button"
  class="barcode-scanner__trigger"
  [disabled]="!soportaCamara"
  [title]="soportaCamara ? 'Escanear código de barras' : 'Tu navegador no admite escaneo por cámara'"
  aria-label="Escanear código de barras"
  (click)="iniciar()"
>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="7" width="18" height="12" rx="2" /><circle cx="12" cy="13" r="3.5" /><path d="M8 7l1.2-2h5.6L16 7" />
  </svg>
</button>

<!--
  [hidden] (no @if) en el overlay: el <video> de adentro nunca se destruye/recrea, así el
  @ViewChild('video') ya tiene una referencia válida ANTES de que iniciar() la necesite (mismo
  motivo, más extenso, en escaneo.component.html).
-->
<div class="barcode-scanner__overlay" [hidden]="!escaneando()" (click)="detener()">
  <div class="barcode-scanner__modal" (click)="$event.stopPropagation()">
    <div class="barcode-scanner__modal-header">
      <span>Escanear código</span>
      <button type="button" class="barcode-scanner__cerrar" aria-label="Cerrar" (click)="detener()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <div class="barcode-scanner__video-wrap">
      <video #video class="barcode-scanner__video" muted playsinline></video>
      @if (escaneando()) {
        <div class="barcode-scanner__marco">
          <span class="barcode-scanner__esquina barcode-scanner__esquina--tl"></span>
          <span class="barcode-scanner__esquina barcode-scanner__esquina--tr"></span>
          <span class="barcode-scanner__esquina barcode-scanner__esquina--bl"></span>
          <span class="barcode-scanner__esquina barcode-scanner__esquina--br"></span>
          @if (!capturado()) {
            <div class="barcode-scanner__linea"></div>
          }
        </div>
        @if (capturado()) {
          <div class="barcode-scanner__flash">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5" />
            </svg>
          </div>
        }
      }
    </div>

    <div class="muted barcode-scanner__ayuda">Apunta la cámara al código de barras o QR</div>
  </div>
</div>
