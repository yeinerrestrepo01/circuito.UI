<nav class="rail" [style.--accent]="accentVar()">
  <div class="rail__dot"></div>
  <div class="rail__nav">
    @for (item of items(); track item.key) {
      <a
        class="rail__item"
        [class.rail__item--active]="activeKey() === item.key"
        [routerLink]="item.ruta"
        [attr.aria-label]="item.label"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          @for (d of trayectos(item.icono); track d) {
            <path [attr.d]="d" />
          }
        </svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </div>
  @if (showSettings()) {
    <a class="rail__item rail__settings" routerLink="/configuracion" aria-label="Configuración">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M12 3v2.4M12 18.6V21M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M3 12h2.4M18.6 12H21M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" />
      </svg>
    </a>
  }
  <div class="rail__avatar" [class.rail__avatar--top]="!showSettings()">{{ iniciales() }}</div>
</nav>
