@if (confirmDialogService.dialogo(); as dialogo) {
  <div class="confirm-dialog__overlay" (click)="confirmDialogService.responder(false)">
    <div class="confirm-dialog" role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">
      @if (dialogo.titulo) {
        <div class="confirm-dialog__titulo">{{ dialogo.titulo }}</div>
      }
      <p class="confirm-dialog__mensaje">{{ dialogo.mensaje }}</p>
      <div class="confirm-dialog__acciones">
        <button type="button" class="btn" (click)="confirmDialogService.responder(false)">{{ dialogo.textoCancelar || 'Cancelar' }}</button>
        <button
          type="button"
          class="btn"
          [class.btn-primary]="!dialogo.peligroso"
          [class.btn-danger]="dialogo.peligroso"
          (click)="confirmDialogService.responder(true)"
        >
          {{ dialogo.textoConfirmar || 'Confirmar' }}
        </button>
      </div>
    </div>
  </div>
}
