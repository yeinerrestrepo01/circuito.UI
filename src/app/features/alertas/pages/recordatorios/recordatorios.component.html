<div class="page">
  <div class="content-header">
    <div>
      <h1 class="page-title">Recordatorios</h1>
      <p class="page-sub">Vida útil de productos vendidos — contacto manual por WhatsApp</p>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
      </svg>
      <input
        type="text"
        placeholder="Buscar por cliente, producto o referencia"
        aria-label="Buscar recordatorio"
        [value]="busqueda()"
        (input)="busqueda.set($any($event.target).value)"
      />
    </label>
  </div>

  <app-card flexCol style="flex-grow:1;">
    <app-data-table [columns]="columnas" [rows]="recordatoriosFiltrados()" emptyMessage="No hay recordatorios pendientes por ahora.">
      <ng-template appCellDef="expiryDate" let-r>{{ r.expiryDate | fechaCorta }}</ng-template>
      <ng-template appCellDef="estado" let-r>
        <app-status-badge [status]="estadoBadge(r)" [label]="estadoLabel(r)" />
      </ng-template>
      <ng-template appCellDef="acciones" let-r>
        <div class="recordatorios-acciones">
          @if (r.customerPhone) {
            <button type="button" class="btn btn-sm btn-primary" (click)="recordarPorWhatsApp(r)">Recordar por WhatsApp</button>
          } @else {
            <span class="muted" style="font-size:12px;">Sin teléfono</span>
          }
          <button type="button" class="btn btn-sm" [disabled]="contactando() === r.id" (click)="marcarContactado(r)">Marcar como contactado</button>
        </div>
      </ng-template>
    </app-data-table>
  </app-card>
</div>
