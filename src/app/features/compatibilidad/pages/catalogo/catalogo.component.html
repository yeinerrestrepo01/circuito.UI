<div class="page">
  <div>
    <h1 class="page-title">Catálogo de compatibilidad</h1>
    <p class="page-sub">Encuentra referencias equivalentes por vehículo o por código OEM</p>
  </div>

  <app-card padded class="catalogo-filtros">
    <form [formGroup]="filtro" (ngSubmit)="buscar()" class="catalogo-filtros__form">
      <app-form-field label="Marca" inputId="marca">
        <select id="marca" formControlName="marca">
          @for (m of marcas; track m) { <option [value]="m">{{ m }}</option> }
        </select>
      </app-form-field>
      <app-form-field label="Línea" inputId="linea">
        <select id="linea" formControlName="linea">
          @for (l of lineas; track l) { <option [value]="l">{{ l }}</option> }
        </select>
      </app-form-field>
      <app-form-field label="Modelo" inputId="modelo">
        <select id="modelo" formControlName="modelo">
          @for (m of modelos; track m) { <option [value]="m">{{ m }}</option> }
        </select>
      </app-form-field>
      <app-form-field label="Año" inputId="anio">
        <select id="anio" formControlName="anio">
          @for (a of anios; track a) { <option [value]="a">{{ a }}</option> }
        </select>
      </app-form-field>
      <button type="submit" class="btn btn-primary" [disabled]="buscando()">{{ buscando() ? 'Buscando…' : 'Buscar' }}</button>
    </form>
  </app-card>

  <app-card flexCol style="flex-grow:1;">
    <app-data-table [columns]="columnas" [rows]="resultados()" emptyMessage="Elige un vehículo y presiona Buscar para ver equivalencias.">
      <ng-template appCellDef="tipoEquivalencia" let-r><span class="muted">{{ r.tipoEquivalencia }}</span></ng-template>
      <ng-template appCellDef="stockRed" let-r>{{ r.stockRed ?? '—' }}</ng-template>
    </app-data-table>
  </app-card>
</div>
