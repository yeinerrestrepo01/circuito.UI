<div class="page">
  <div>
    <h1 class="page-title">Órdenes de compra</h1>
    <p class="page-sub">Generadas desde Sugerencia de compras — quedan pendientes hasta que la mercancía llegue de verdad</p>
  </div>

  <div class="tabs">
    <a routerLink="/compras" routerLinkActive="tabs__item--active" [routerLinkActiveOptions]="{ exact: true }" class="tabs__item">Sugerencias</a>
    <a routerLink="/compras/ordenes" routerLinkActive="tabs__item--active" class="tabs__item">Órdenes de compra</a>
  </div>

  <app-card flexCol style="flex-grow:1;">
    <app-data-table [columns]="columnas" [rows]="filas()" emptyMessage="Aún no se ha generado ninguna orden de compra.">
      <ng-template appCellDef="createdAt" let-f>{{ f.createdAt | fechaCorta: true }}</ng-template>
      <ng-template appCellDef="status" let-f>
        <app-status-badge [status]="estadoBadge(f.status)" [label]="estadoLabel(f.status)" />
      </ng-template>
      <ng-template appCellDef="acciones" let-f>
        @if (f.status === 'Pending') {
          <div class="ordenes-acciones">
            <button type="button" class="btn btn-sm" [disabled]="procesando() === f.orden.id" (click)="recibir(f.orden)">Recibir</button>
            <button type="button" class="btn btn-sm" [disabled]="procesando() === f.orden.id" (click)="cancelar(f.orden)">Cancelar</button>
          </div>
        }
      </ng-template>
    </app-data-table>
  </app-card>
</div>
