<div class="page">
  <div>
    <h1 class="page-title">Sugerencia de compras</h1>
    <p class="page-sub">Productos con stock igual o por debajo de su mínimo, agrupados por proveedor principal</p>
  </div>

  <div class="tabs">
    <a routerLink="/compras" routerLinkActive="tabs__item--active" [routerLinkActiveOptions]="{ exact: true }" class="tabs__item">Sugerencias</a>
    <a routerLink="/compras/ordenes" routerLinkActive="tabs__item--active" class="tabs__item">Órdenes de compra</a>
  </div>

  <app-card flexCol style="flex-grow:1;">
    <app-data-table [columns]="columnas" [rows]="sugerencias()" emptyMessage="No hay sugerencias de compra por ahora.">
      <ng-template appCellDef="seleccionado" let-s>
        <input
          type="checkbox"
          [attr.aria-label]="'Seleccionar ' + s.productName"
          [checked]="estaSeleccionado(s.sku)"
          (change)="alternar(s.sku)"
        />
      </ng-template>
      <ng-template appCellDef="suggestedQuantity" let-s>
        <input
          type="number"
          min="1"
          [value]="cantidadDe(s.sku)"
          (input)="actualizarCantidad(s.sku, +$any($event.target).value)"
          class="sugerencias-cantidad-input"
          [attr.aria-label]="'Cantidad a pedir de ' + s.productName"
        />
      </ng-template>
      <ng-template appCellDef="reason" let-s><span class="muted" style="font-size:13px;">{{ s.reason }}</span></ng-template>
    </app-data-table>
  </app-card>

  <app-card padded class="sugerencias-footer">
    <span class="sugerencias-footer__summary">{{ seleccionados().size }} referencias seleccionadas · agrupadas por {{ proveedoresSeleccionados() }} proveedores</span>
    <button type="button" class="btn btn-primary sugerencias-footer__action" (click)="generarOrden()" [disabled]="seleccionados().size === 0 || generando()">
      {{ generando() ? 'Generando…' : 'Generar orden de compra' }}
    </button>
  </app-card>
</div>
