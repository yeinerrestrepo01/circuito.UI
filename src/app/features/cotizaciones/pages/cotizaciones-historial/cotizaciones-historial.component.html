<div class="page">
  <div class="content-header">
    <div>
      <h1 class="page-title page-title--sm">Cotizaciones</h1>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
      </svg>
      <input
        type="text"
        placeholder="Buscar por número o cliente"
        aria-label="Buscar cotización"
        [value]="busqueda()"
        (input)="busqueda.set($any($event.target).value)"
      />
    </label>
  </div>

  <div class="tabs">
    <a routerLink="/ventas" routerLinkActive="tabs__item--active" [routerLinkActiveOptions]="{ exact: true }" class="tabs__item">Nueva venta</a>
    <a routerLink="/ventas/cotizaciones" routerLinkActive="tabs__item--active" class="tabs__item">Cotizaciones</a>
    <a routerLink="/ventas/historial" routerLinkActive="tabs__item--active" class="tabs__item">Historial</a>
  </div>

  <div class="content-header__actions" style="justify-content:flex-end;">
    <a routerLink="/ventas/cotizaciones/nueva" class="btn btn-primary">+ Nueva cotización</a>
  </div>

  <app-card flexCol style="flex-grow:1;">
    <app-data-table [columns]="columnas" [rows]="cotizacionesFiltradas()" emptyMessage="Aún no se ha generado ninguna cotización.">
      <ng-template appCellDef="createdAt" let-c>{{ c.createdAt | fechaCorta: true }}</ng-template>
      <ng-template appCellDef="expiresAt" let-c>{{ c.expiresAt | fechaCorta }}</ng-template>
      <ng-template appCellDef="subtotal" let-c>{{ c.subtotal | cop }}</ng-template>
      <ng-template appCellDef="status" let-c>
        <app-status-badge [status]="estadoBadge(c)" [label]="estadoLabel(c)" />
      </ng-template>
      <ng-template appCellDef="acciones" let-c>
        <div class="cotizaciones-acciones">
          <button type="button" class="btn btn-sm" (click)="ver(c)">Ver</button>
          <button type="button" class="btn btn-sm" (click)="imprimir(c)">Imprimir</button>
          @if (puedeCancelar(c)) {
            <button type="button" class="btn btn-sm" [disabled]="cancelando() === c.id" (click)="cancelar(c)">Cancelar</button>
          }
        </div>
      </ng-template>
    </app-data-table>
  </app-card>
</div>
