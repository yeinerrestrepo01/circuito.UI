<div class="page">
  <div class="content-header">
    <div>
      <h1 class="page-title">Inventario</h1>
    </div>
    <div class="content-header__actions">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input type="text" placeholder="Buscar referencia o nombre" aria-label="Buscar" />
      </label>
      <a routerLink="/inventario/proveedores" class="btn">Proveedores</a>
      <a routerLink="/inventario/categorias" class="btn">Categorías</a>
      <a routerLink="/inventario/nuevo" class="btn btn-soft">+ Crear producto nuevo</a>
      <a routerLink="/inventario/ajustes" class="btn btn-primary">Registrar movimiento</a>
    </div>
  </div>

  <div class="kpi-grid">
    <app-service-ring [percentage]="94" label="Nivel de servicio" sublabel="Pedidos surtidos completos" />
    <app-kpi-tile label="Alertas de vencimiento" value="12" variant="warning" />
    <app-kpi-tile label="Quiebres de stock" [value]="quiebresDeStock() + ''" variant="danger" />
    <app-kpi-tile label="Ventas del mes" [value]="ventasDelMes" variant="success" />
  </div>

  <div class="grid-2-1">
    <app-card flexCol>
      <div class="card__header">
        Productos registrados
        <span class="muted" style="font-size:12px; font-weight:400;">{{ productos().length }} en total</span>
      </div>
      <app-data-table [columns]="columnasTodos" [rows]="productos()" emptyMessage="Aún no hay productos registrados.">
        <ng-template appCellDef="sku" let-p>
          <a [routerLink]="['/inventario', p.sku]" class="dashboard-fila-link" [class.dashboard-fila-link--inactivo]="!p.isActive">{{ p.sku }}</a>
        </ng-template>
        <ng-template appCellDef="name" let-p>
          {{ p.name }}
          @if (!p.isActive) { <span class="badge" style="margin-left:6px;">Inactivo</span> }
        </ng-template>
        <ng-template appCellDef="stockQuantity" let-p>{{ p.stockQuantity }}</ng-template>
        <ng-template appCellDef="status" let-p>
          <app-status-badge [status]="estadoBadge(p.status)" [label]="estadoLabel(p.status)" />
        </ng-template>
        <ng-template appCellDef="acciones" let-p>
          <div class="dashboard-acciones">
            <a [routerLink]="['/inventario', p.sku]" class="btn btn-sm">Ver</a>
            <a [routerLink]="['/inventario', p.sku, 'editar']" class="btn btn-sm">Editar</a>
            <button
              type="button"
              class="btn btn-sm"
              [disabled]="cambiandoEstadoId() === p.id"
              (click)="cambiarEstado(p)"
            >
              {{ p.isActive ? 'Inactivar' : 'Reactivar' }}
            </button>
          </div>
        </ng-template>
      </app-data-table>
    </app-card>

    <app-card flexCol>
      <div class="card__header">
        Productos con alerta
        <span class="muted" style="font-size:12px; font-weight:400;">{{ productosConAlerta().length }} activas</span>
      </div>
      <app-data-table [columns]="columnasAlerta" [rows]="productosConAlerta()" emptyMessage="Sin alertas de stock por ahora.">
        <ng-template appCellDef="sku" let-p>
          <a [routerLink]="['/inventario', p.sku]" class="dashboard-fila-link">{{ p.sku }}</a>
        </ng-template>
      </app-data-table>
    </app-card>
  </div>
</div>
