<div class="page">
  <div class="content-header">
    <div>
      <div class="breadcrumb"><a routerLink="/inventario">Inventario</a><span>/</span><span>Proveedores</span></div>
      <h1 class="page-title page-title--sm">Proveedores</h1>
    </div>
    @if (!mostrarFormulario()) {
      <button class="btn btn-primary" (click)="abrirFormulario()">+ Nuevo proveedor</button>
    }
  </div>

  @if (mostrarFormulario()) {
    <app-card padded>
      <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
        <div style="font-size:15px; font-weight:500; margin-bottom:14px;">Nuevo proveedor</div>
        <div class="proveedores-form__grid">
          <app-form-field label="Nombre" inputId="prov-nombre">
            <input id="prov-nombre" type="text" formControlName="name" placeholder="Ej. Baterías del Huila" />
          </app-form-field>
          <app-form-field label="NIT (opcional)" inputId="prov-nit">
            <input id="prov-nit" type="text" formControlName="taxId" placeholder="900123456-7" style="font-family:var(--font-mono);" />
          </app-form-field>
          <app-form-field label="Dirección (opcional)" inputId="prov-direccion">
            <input id="prov-direccion" type="text" formControlName="address" placeholder="Ej. Cra 5 #12-34, Neiva" />
          </app-form-field>
          <app-form-field label="Contacto (opcional)" inputId="prov-contacto">
            <input id="prov-contacto" type="text" formControlName="contactName" placeholder="Ej. Carlos Pérez" />
          </app-form-field>
          <app-form-field label="Teléfono (opcional)" inputId="prov-telefono">
            <input id="prov-telefono" type="tel" formControlName="phone" placeholder="Ej. 3101234567" />
          </app-form-field>
          <app-form-field label="Correo (opcional)" inputId="prov-correo">
            <input id="prov-correo" type="email" formControlName="email" placeholder="contacto@proveedor.com" />
          </app-form-field>
        </div>
        <div class="proveedores-form__acciones">
          <button type="button" class="btn" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="guardando()">
            {{ guardando() ? 'Guardando…' : 'Guardar proveedor' }}
          </button>
        </div>
      </form>
    </app-card>
  }

  <app-card>
    <app-data-table [columns]="columnas" [rows]="proveedores()" emptyMessage="Aún no hay proveedores creados.">
      <ng-template appCellDef="taxId" let-p><span class="muted mono">{{ p.taxId ?? '—' }}</span></ng-template>
      <ng-template appCellDef="address" let-p><span class="muted">{{ p.address ?? '—' }}</span></ng-template>
      <ng-template appCellDef="contactName" let-p><span class="muted">{{ p.contactName ?? '—' }}</span></ng-template>
      <ng-template appCellDef="phone" let-p><span class="muted">{{ p.phone ?? '—' }}</span></ng-template>
      <ng-template appCellDef="email" let-p><span class="muted">{{ p.email ?? '—' }}</span></ng-template>
    </app-data-table>
  </app-card>
</div>
