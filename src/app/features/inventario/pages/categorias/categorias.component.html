<div class="page">
  <div class="content-header">
    <div>
      <h1 class="page-title page-title--sm">Categorías de producto</h1>
    </div>
    <button class="btn btn-primary" (click)="abrirFormulario()">+ Nueva categoría</button>
  </div>

  <app-card>
    <app-data-table [columns]="columnas" [rows]="categorias()" emptyMessage="Aún no hay categorías creadas.">
      <ng-template appCellDef="acciones" let-c>
        <button type="button" class="btn btn-sm" (click)="editar(c)">Editar</button>
      </ng-template>
    </app-data-table>
  </app-card>

  @if (mostrarFormulario()) {
    <div class="categorias-panel__overlay" (click)="cancelar()"></div>
    <aside class="categorias-panel" role="dialog" aria-modal="true" aria-label="Categoría">
      <div class="categorias-panel__header">
        <span>{{ editando() ? 'Editar categoría' : 'Nueva categoría' }}</span>
        <button type="button" class="categorias-panel__cerrar" (click)="cancelar()" aria-label="Cerrar">×</button>
      </div>
      <form [formGroup]="form" (ngSubmit)="guardar()" novalidate class="categorias-panel__form">
        <div class="categorias-panel__campos">
          <app-form-field label="Nombre" inputId="cat-nombre">
            <input id="cat-nombre" type="text" formControlName="name" placeholder="Ej. Batería" />
          </app-form-field>
        </div>
        <div class="categorias-panel__acciones">
          <button type="button" class="btn" (click)="cancelar()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="guardando()">
            {{ guardando() ? 'Guardando…' : editando() ? 'Guardar cambios' : 'Guardar categoría' }}
          </button>
        </div>
      </form>
    </aside>
  }
</div>
