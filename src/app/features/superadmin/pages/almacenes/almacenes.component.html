<div class="page">
  <div class="content-header">
    <div>
      <span class="badge badge--warning">Superadministrador</span>
      <h1 class="page-title" style="margin-top:8px;">Almacenes</h1>
      <div class="page-sub">{{ activos() }} activos · {{ enPrueba() }} en prueba · {{ suspendidos() }} suspendido(s)</div>
    </div>
  </div>

  <div class="almacenes-body">
    <app-card flexCol class="almacenes-tabla">
      <app-data-table [columns]="columnas" [rows]="almacenes()" emptyMessage="Aún no hay almacenes registrados en la plataforma.">
        <ng-template appCellDef="razonSocial" let-a><span style="font-weight:500;">{{ a.razonSocial }}</span></ng-template>
        <ng-template appCellDef="ciudad" let-a><span class="muted">{{ a.ciudad }}</span></ng-template>
        <ng-template appCellDef="estado" let-a><app-status-badge [status]="estadoBadge(a.estado)" [label]="estadoLabel(a.estado)" /></ng-template>
        <ng-template appCellDef="ultimoAcceso" let-a><span class="muted">{{ a.ultimoAcceso }}</span></ng-template>
      </app-data-table>
    </app-card>

    <app-card padded class="almacenes-nuevo">
      <form [formGroup]="form" (ngSubmit)="crear()" novalidate class="flex-col gap-4">
        <div>
          <div style="font-size:16px; font-weight:500;">Nuevo almacén</div>
          <div class="muted" style="font-size:12px; margin-top:2px;">Se aprovisiona un schema aislado al crear.</div>
        </div>

        <app-form-field label="Razón social" inputId="razon">
          <input id="razon" type="text" formControlName="razonSocial" placeholder="Ej. Repuestos El Motor SAS" />
        </app-form-field>
        <app-form-field label="NIT" inputId="nit">
          <input id="nit" type="text" formControlName="nit" placeholder="900123456-7" style="font-family:var(--font-mono);" />
        </app-form-field>
        <app-form-field label="Ciudad" inputId="ciudad">
          <input id="ciudad" type="text" formControlName="ciudad" placeholder="Ej. Neiva" />
        </app-form-field>
        <app-form-field label="Correo del administrador" inputId="correo-admin">
          <input id="correo-admin" type="email" formControlName="correoAdministrador" placeholder="admin@almacen.com" />
        </app-form-field>
        <app-form-field label="Plan" inputId="plan">
          <select id="plan" formControlName="plan">
            @for (p of planes; track p) { <option [value]="p">{{ p }}</option> }
          </select>
        </app-form-field>

        <button type="submit" class="btn" style="margin-top:8px; height:44px; background: var(--color-info); color:#fff; border:none;" [disabled]="creando()">
          {{ creando() ? 'Creando…' : 'Crear almacén' }}
        </button>
      </form>
    </app-card>
  </div>
</div>
