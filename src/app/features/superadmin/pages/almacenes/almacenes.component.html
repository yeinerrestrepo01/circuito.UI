<div class="page">
  <div class="content-header">
    <div>
      <span class="badge badge--warning">Superadministrador</span>
      <h1 class="page-title" style="margin-top:8px;">Almacenes</h1>
      <div class="page-sub">{{ activas() }} activas · {{ enPrueba() }} en prueba · {{ suspendidas() }} suspendida(s)</div>
    </div>
  </div>

  <div class="almacenes-body">
    <app-card flexCol class="almacenes-tabla">
      <app-data-table [columns]="columnas" [rows]="empresas()" emptyMessage="Aún no hay empresas registradas en la plataforma.">
        <ng-template appCellDef="name" let-e><span style="font-weight:500;">{{ e.name }}</span></ng-template>
        <ng-template appCellDef="city" let-e><span class="muted">{{ e.city }}</span></ng-template>
        <ng-template appCellDef="status" let-e>
          <div class="almacenes-estado">
            <app-status-badge [status]="estadoBadge(e.status)" [label]="estadoLabel(e.status)" />
            <select
              class="almacenes-estado__select"
              aria-label="Cambiar estado"
              [value]="e.status"
              (change)="cambiarEstado(e, $any($event.target).value)"
            >
              @for (op of estados; track op) { <option [value]="op">{{ estadoLabel(op) }}</option> }
            </select>
          </div>
        </ng-template>
        <ng-template appCellDef="maxLocations" let-e>
          <div class="almacenes-limite">
            <span>{{ e.maxLocations }}</span>
            <button
              type="button"
              class="btn btn-sm"
              [disabled]="actualizandoLimite() === e.id"
              (click)="actualizarLimiteSedes(e)"
            >
              Cambiar
            </button>
          </div>
        </ng-template>
      </app-data-table>
    </app-card>

    <app-card padded class="almacenes-nuevo">
      <form [formGroup]="form" (ngSubmit)="crear()" novalidate class="flex-col gap-4">
        <div>
          <div style="font-size:17px; font-weight:500;">Nuevo almacén</div>
          <div class="muted" style="font-size:13px; margin-top:2px;">Se aprovisiona un schema aislado al crear.</div>
        </div>

        <app-form-field label="Razón social" inputId="razon">
          <input id="razon" type="text" formControlName="name" placeholder="Ej. Repuestos El Motor SAS" />
        </app-form-field>
        <app-form-field label="NIT" inputId="nit">
          <input id="nit" type="text" formControlName="taxId" placeholder="900123456-7" style="font-family:var(--font-mono);" />
        </app-form-field>
        <app-form-field label="Ciudad" inputId="ciudad">
          <input id="ciudad" type="text" formControlName="city" placeholder="Ej. Neiva" />
        </app-form-field>
        <app-form-field label="Nombre de la sede inicial" inputId="sede-inicial">
          <input id="sede-inicial" type="text" formControlName="initialLocationName" placeholder="Ej. Sede principal" />
        </app-form-field>

        <div class="almacenes-nuevo__separador">Administrador de la empresa</div>

        <app-form-field label="Nombre" inputId="nombre-admin">
          <input id="nombre-admin" type="text" formControlName="adminFirstName" placeholder="Ej. Camilo" />
        </app-form-field>
        <app-form-field label="Apellido" inputId="apellido-admin">
          <input id="apellido-admin" type="text" formControlName="adminLastName" placeholder="Ej. Vega" />
        </app-form-field>
        <app-form-field label="Teléfono" inputId="telefono-admin">
          <input id="telefono-admin" type="tel" formControlName="adminPhone" placeholder="Ej. 3001234567" />
        </app-form-field>
        <app-form-field label="Correo del administrador" inputId="correo-admin">
          <input id="correo-admin" type="email" formControlName="adminEmail" placeholder="admin@almacen.com" />
        </app-form-field>
        <app-form-field label="Contraseña inicial" inputId="password-admin">
          <input id="password-admin" type="password" formControlName="adminPassword" placeholder="Mínimo 8 caracteres" />
        </app-form-field>

        <button type="submit" class="btn" style="margin-top:8px; height:44px; background: var(--color-info); color:#fff; border:none;" [disabled]="creando()">
          {{ creando() ? 'Creando…' : 'Crear almacén' }}
        </button>
      </form>
    </app-card>
  </div>
</div>
